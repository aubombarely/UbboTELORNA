name: ubbotelorna
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - setuptools        # provides pkg_resources
  - pip
  - hmmer             # nhmmer — rRNA annotation (Module 2, default)
  - infernal          # cmsearch — rRNA annotation (Module 2, --search_tool cmsearch)
  - aragorn           # tRNA annotation (Module 3)
  - tantan            # low-complexity masking (Module 1)
  - matplotlib        # visualization (Module 5)
  - trf               # subtelomeric tandem repeat detection (Module 7)
  - pip:
    - codecarbon      # carbon footprint tracking (pip build avoids pkg_resources issues)
