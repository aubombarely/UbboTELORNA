name: ubbotelorna
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - setuptools           # provides pkg_resources (required by codecarbon)
  - infernal          # cmsearch — rRNA annotation (Module 2)
  - aragorn           # tRNA annotation (Module 3)
  - tantan            # low-complexity masking (Module 1)
  - conda-forge::codecarbon   # carbon footprint tracking
