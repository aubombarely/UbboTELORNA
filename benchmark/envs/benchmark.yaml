name: ubbotelorna_bench
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - snakemake>=7.0
  - ncbi-datasets-cli    # official NCBI datasets CLI; replaces ncbi-genome-download (broken on new NCBI summary columns)
  - barrnap                # rRNA comparator
  - trnascan-se            # tRNA comparator
  - tidk                   # telomere comparator (Rust binary via bioconda)
  - matplotlib
  - pandas
  - scipy                  # for statistical tests in benchmark_report.py
  - seaborn                # heatmap styling
  - codecarbon             # green_benchmark.py — per-tool emissions tracking
  - setuptools<82          # codecarbon imports pkg_resources (from setuptools)
                            # internally; setuptools 82.0.0 (2026-02-08) removed
                            # pkg_resources entirely, breaking `import codecarbon`
                            # with ModuleNotFoundError -- must stay below 82
