<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <radialGradient id="bgGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1a3d5c"/>
      <stop offset="100%" stop-color="#080f1a"/>
    </radialGradient>
    <!-- Soft glow for the protoplasmic blob -->
    <filter id="protoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shadow ring -->
  <circle cx="130" cy="130" r="128" fill="#080f1a"/>

  <!-- Main background -->
  <circle cx="130" cy="130" r="124" fill="url(#bgGrad)"/>

  <!-- ── Three arc segments (radius 112, width 14) ───────────────────────────
       Each arc spans 116° with 4° gaps at the three junctions.
       Junctions at -90° (top), 30° (bottom-right), 150° (bottom-left).

       Telomere (amber #f59e0b) : -88° → +28°
         Start(-88°): (133.9, 18.1)   End(28°): (228.9, 182.6)

       rRNA     (blue  #4C9BE8) : +32° → +148°
         Start(32°):  (224.9, 189.3)  End(148°): (35.1, 189.3)

       tRNA     (red   #E8604C) : +152° → +268°
         Start(152°): (31.1, 182.6)   End(268°): (126.1, 18.1)
  -->

  <!-- Telomere arc -->
  <path d="M 133.9 18.1 A 112 112 0 0 1 228.9 182.6"
        stroke="#f59e0b" stroke-width="14" fill="none"
        stroke-linecap="round"/>

  <!-- rRNA arc -->
  <path d="M 224.9 189.3 A 112 112 0 0 1 35.1 189.3"
        stroke="#4C9BE8" stroke-width="14" fill="none"
        stroke-linecap="round"/>

  <!-- tRNA arc -->
  <path d="M 31.1 182.6 A 112 112 0 0 1 126.1 18.1"
        stroke="#E8604C" stroke-width="14" fill="none"
        stroke-linecap="round"/>

  <!-- Junction dots (at -90°, 30°, 150°, radius 112) -->
  <circle cx="130"   cy="18"  r="5.5" fill="#2dd4bf"/>
  <circle cx="227"   cy="186" r="5.5" fill="#2dd4bf"/>
  <circle cx="33"    cy="186" r="5.5" fill="#2dd4bf"/>

  <!-- Subtle inner ring -->
  <circle cx="130" cy="130" r="96" fill="none"
          stroke="#1a3d5c" stroke-width="1" opacity="0.6"/>

  <!-- Arc labels at mid-arc radius ~88 -->
  <!-- Telomere midpoint at -30° → (206, 86) -->
  <text x="206" y="90" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="8"
        fill="#f59e0b" font-weight="bold"
        transform="rotate(30, 206, 90)">TELOMERE</text>

  <!-- rRNA midpoint at 90° → (130, 218) -->
  <text x="130" y="218" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="8"
        fill="#4C9BE8" font-weight="bold">rRNA</text>

  <!-- tRNA midpoint at 210° → (54, 86) -->
  <text x="54" y="90" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="8"
        fill="#E8604C" font-weight="bold"
        transform="rotate(-30, 54, 90)">tRNA</text>

  <!-- ── Protoplasmic blob (Ubbo-Sathla) ──────────────────────────────────
       An amorphous, amoeba-like shadow under the text, evoking the
       formless primordial mass from Clark Ashton Smith's "Ubbo-Sathla".

       Main blob path: three pseudopod extensions radiate from the body —
         · upper-right (toward the telomere arc)
         · lower-centre (bulging downward)
         · left (toward the tRNA arc)
       The nucleus is a smaller inner highlight blob giving depth.
  -->
  <!-- Main protoplasmic body -->
  <path d="
    M 138 70
    C 158 60, 184 62, 200 78
    C 218 96, 216 116, 206 132
    C 198 145, 184 146, 186 162
    C 188 178, 198 188, 185 196
    C 172 204, 152 198, 136 194
    C 120 190, 104 194, 88 186
    C 72 178, 60 162, 58 146
    C 56 130, 64 115, 58 100
    C 52 85, 46 68, 62 60
    C 78 52, 98 60, 114 66
    C 124 70, 130 70, 138 70
    Z"
    fill="#0d5068" opacity="0.38" filter="url(#protoGlow)"/>

  <!-- Inner nucleus highlight — gives the blob a wet, translucent look -->
  <path d="
    M 136 90
    C 148 84, 164 86, 172 98
    C 180 110, 178 128, 168 138
    C 158 148, 142 150, 130 144
    C 118 138, 108 126, 110 114
    C 112 102, 124 92, 136 90
    Z"
    fill="#1a7a92" opacity="0.20"/>

  <!-- Mythos entity name (small, italic) -->
  <text x="130" y="62" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="9"
        fill="#2d8fa0" font-style="italic" opacity="0.85">Ubbo-Sathla</text>

  <!-- Main tool name -->
  <text x="130" y="115" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="19"
        fill="#2dd4bf" font-weight="bold">UbboTELORNA</text>

  <!-- Subtitle -->
  <text x="130" y="138" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="9"
        fill="#5a9aaa">Genome Element Annotator</text>

  <!-- Version -->
  <text x="130" y="160" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="9"
        fill="#3a6070">v0.1.0</text>
</svg>
